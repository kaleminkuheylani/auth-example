[build]
  command = "node --version && npm --version && npx vite build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# API redirects → Netlify Functions
[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth"
  status = 200
  force = true

[[redirects]]
  from = "/api/email/*"
  to = "/.netlify/functions/email"
  status = 200
  force = true

[[redirects]]
  from = "/chat/*"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[redirects]]
  from = "/gifts/*"
  to = "/.netlify/functions/gifts"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
